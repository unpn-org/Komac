[package]
name = "komac"
version = "2.16.0"
authors = ["Russell Banks"]
edition = "2024"
rust-version = "1.95"
description = "A manifest creator for winget-pkgs"
license = "GPL-3.0-or-later"
repository = "https://github.com/russellbanks/Komac"
readme = "README.md"
documentation = "https://github.com/russellbanks/Komac/blob/main/README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["winget", "winget-pkgs", "winget-cli", "windows"]
build = "build.rs"
include = ["**/*.rs", "assets/github.graphql", "assets/branding/logo.ico"]

[[bin]]
name = "komac"
path = "src/main.rs"
required-features = ["cli"]

# https://doc.rust-lang.org/stable/cargo/guide/build-performance.html#reduce-amount-of-generated-debug-information
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3 # Anthelion

[dependencies]
anstream = "1.0.0"
base64ct = { version = "1.8.3", features = ["std"] }
bitflags = "2.13.1"
bon = "3.10.0"
bytes = "1.12.1"
bzip2 = "0.6.1"
cab = "0.6.0"
camino = { version = "1.2.5", features = ["serde1"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "cargo", "env"] }
clap_complete = "4.6.9"
codepage = "0.1.2"
color-eyre = { version = "0.6.5", default-features = false }
compact_str = "0.10.0"
const_format = { version = "0.2.36", features = ["derive"] }
crossbeam-channel = "0.5.16"
cynic = { version = "3.14.0", features = ["http-reqwest"] }
encoding_rs = "0.8.35"
flate2 = "1.1.10"
futures-util = "0.3.34"
html2text = "0.17.1"
indexmap = "2.14.1"
indextree = "4.9.1"
indicatif = "0.18.6"
inno = "0.6.0"
inquire = "0.9.4"
itertools = "0.15.0"
itoa = "1.0.18"
keyring-core = { version = "1.0.0", optional = true }
lzma-rust2 = { version = "0.20.1", features = ["std"] }
memchr = "2.8.3"
msi = "0.10.0"
nt-time = { version = "0.15.0", features = ["chrono"] }
num_cpus = "1.17.0"
open = "5.4.3"
ordinal = "0.4.1"
owo-colors = "4.4.0"
percent-encoding = "2.3.2"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.10.2"
ratatui = "0.30.2"
ratatui-textarea = { version = "0.9.2", features = ["search"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "stream", "system-proxy"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] } # Anthelion
serde_with = "3.22.0"
serde-saphyr = "1.2.0" # Anthelion
sevenz-rust2 = "0.22.2"
sha2 = "0.11.0"
strsim = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
supports-hyperlinks = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "parking_lot"] }
tracing = { version = "0.1.44", features = ["release_max_level_trace"] }
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"
tree-sitter-highlight = "0.26.13"
tree-sitter-yaml = "0.7.2"
typed-path = "0.12.3"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
winget-types = { version = "0.5.0", features = ["serde", "std", "chrono", "serde-saphyr"] } # Anthelion
zerocopy = { version = "0.8.56", features = ["derive", "std"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Anthelion Start
napi = { version = "3.12.1", features = ["async", "tokio_rt"] }
napi-derive = "3.6.3"
pulldown-cmark = "0.13.4"
# Anthelion End

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["vendored"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false, optional = true }

[target.'cfg(target_env = "musl")'.dependencies]
openssl-vendored = { package = "openssl", version = "0.10.80", features = ["vendored"], optional = true }

[features]
default = ["cli", "openssl"]
cli = [
    "dep:apple-native-keyring-store",
    "dep:dbus-secret-service-keyring-store",
    "dep:keyring-core",
    "dep:windows-native-keyring-store",
]
node = ["dep:openssl-vendored", "reqwest/native-tls"]
openssl = ["dbus-secret-service-keyring-store?/crypto-openssl", "reqwest/native-tls-vendored"]
rustls = ["dbus-secret-service-keyring-store?/crypto-rust", "reqwest/rustls"]

[build-dependencies]
cynic-codegen = { version = "3.14.0", features = ["rkyv"] }
windows_exe_info = { version = "0.5.2", features = ["manifest"] }
# Anthelion Start
napi-build = "2.4.1"

[lib]
name = "anthelion_komac"
crate-type = ["cdylib"]

[patch.crates-io]
winget-types = { git = "https://github.com/UnownPlain/winget-types.git", branch = "anthelion" }
serde-saphyr = { git = "https://github.com/UnownPlain/serde-saphyr.git", branch = "anthelion" }
# Anthelion End

[dev-dependencies]
indoc = "2.0.7"
rstest = "0.26.1"

[package.metadata.generate-rpm]
assets = [{ source = "target/release/komac", dest = "/usr/bin/komac", mode = "755" }]
